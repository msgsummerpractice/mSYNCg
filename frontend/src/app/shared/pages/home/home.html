<div class="min-h-dvh bg-brand-surface">
  <header
    class="flex min-h-[72px] flex-wrap items-center justify-between gap-3 bg-brand-primary px-4 py-3 text-brand-on-primary sm:px-10 sm:py-0"
    role="banner"
  >
    <div class="text-lg font-light tracking-[0.08em] sm:text-[1.8rem]">.msg</div>

    <div class="flex items-center gap-3 sm:gap-5">
      <mat-divider vertical class="!h-9 border-brand-on-primary-70"></mat-divider>

      <section class="flex min-w-0 items-center gap-2 sm:gap-3" aria-label="User profile">
        <div class="min-w-0 text-right">

          <p class="text-brand-on-primary-80 m-0 mt-0.5 text-[0.7rem] font-normal sm:text-xs"

          >

          aria-hidden="true"
        ></div>
      </section>

  <main class="p-4 sm:p-10">
    <h1 class="text-brand-on-secondary mb-5 text-xl font-semibold sm:mb-6 sm:text-2xl"></h1>

    <section>
      <h2 class="mb-4 text-sm font-semibold sm:text-base"></h2>
