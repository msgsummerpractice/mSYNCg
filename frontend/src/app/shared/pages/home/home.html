<div class="min-h-dvh bg-gray-100">
  <header
    class="flex h-[72px] items-center justify-between bg-[#a01441] px-4 text-white sm:px-10"
    role="banner"
  >
    <div class="text-xl font-light tracking-[0.08em] sm:text-[1.8rem]">.msg</div>

    <div class="flex items-center gap-5">
      <button
        mat-button
        [matMenuTriggerFor]="languageMenu"
        class="!rounded-full !bg-white !px-4 !text-[#a01441]"
      >
        EN
        <mat-icon>keyboard_arrow_down</mat-icon>
      </button>

      <mat-menu #languageMenu="matMenu">
        <button mat-menu-item>RO</button>
        <button mat-menu-item>DE</button>
      </mat-menu>

      <mat-divider vertical class="!h-9 !border-white/70"></mat-divider>

      <section class="flex items-center gap-3" aria-label="User profile">
        <div class="text-right">
          <p class="m-0 text-sm font-bold">User Name</p>

          <p class="m-0 mt-0.5 text-xs font-normal text-white/80">Role</p>
        </div>

        <div
          class="h-10 w-10 rounded-full border-2 border-white/90 bg-white/20"
          aria-hidden="true"
        ></div>
      </section>
    </div>
  </header>

  <main class="p-10">
    <h1 class="mb-6 text-2xl font-semibold text-[#6f1d2b]">Welcome back, User</h1>

    <section>
      <h2 class="mb-4 font-semibold">My Upcoming Events</h2>
    </section>
  </main>
</div>
