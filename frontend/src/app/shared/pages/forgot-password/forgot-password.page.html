<app-toolbar-view [showNavigation]="false" [showUserIcon]="false">
  <app-language-switcher></app-language-switcher>
</app-toolbar-view>

<main
  class="min-h-[calc(100dvh-3.5rem)] overflow-x-hidden bg-[radial-gradient(circle_at_top_left,rgba(160,20,65,0.10),transparent_32%),linear-gradient(135deg,#f8fafc_0%,#eef2f7_48%,#f8f0f3_100%)] px-3 py-6 sm:px-4 sm:py-8 md:py-10"
>
  <section class="mx-auto w-full max-w-[26rem]">
    <div
      class="rounded-2xl border border-white/80 bg-white/95 p-4 shadow-[0_18px_55px_rgba(15,23,42,0.12)] backdrop-blur sm:p-5 md:p-6"
    >
      <div class="mb-5 border-b border-gray-200 pb-5">
        <p class="text-sm font-semibold uppercase tracking-wide text-[#A01441]">
          {{ 'FORGOT_PASSWORD.WELCOME' | translate }}
        </p>

        <h1 class="mt-2 text-xl font-semibold leading-tight text-gray-950 sm:text-2xl">
          {{ 'FORGOT_PASSWORD.TITLE' | translate }}
        </h1>

        <p class="mt-3 text-sm leading-5 text-gray-600 sm:leading-6">
          {{ 'FORGOT_PASSWORD.DESCRIPTION' | translate }}
        </p>
      </div>

      <app-forgot-password-form-container></app-forgot-password-form-container>
    </div>
  </section>
</main>
