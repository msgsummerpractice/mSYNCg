<form [formGroup]="formGroup" (ngSubmit)="onSubmit()" class="flex w-full flex-col gap-4 sm:gap-5">
  <ng-content></ng-content>

  <button
    type="submit"
    [disabled]="isLoading"
    mat-flat-button
    color="primary"
    class="mt-3 w-full py-3 text-base sm:mt-4 sm:py-6 sm:text-lg"
  >
    {{ submitLabel }}
  </button>
</form>
