<mat-form-field appearance="outline">
  <mat-label>Language</mat-label>
  <mat-select [value]="currentLang" (selectionChange)="onSelectionChange($event.value)">
    <mat-option *ngFor="let lang of languages" [value]="lang.code">
      {{ lang.label }}
    </mat-option>
  </mat-select>
</mat-form-field>
