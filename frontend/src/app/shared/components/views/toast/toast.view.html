<div
  class="fixed right-4 bottom-10 left-4 z-50 space-y-2 pointer-events-none sm:left-auto sm:w-[min(24rem,calc(100vw-2rem))]"
>
  @for (toast of toasts; track toast.id) {
  <div
    [class]="getToastClasses(toast.type)"
    class="w-full rounded-lg p-4 shadow-lg pointer-events-auto animate-slideIn"
  >
    <div class="flex items-center justify-between gap-4">
      <p class="text-sm font-medium">{{ toast.message }}</p>
      <button
        (click)="onCloseClick(toast.id)"
        class="text-lg font-bold leading-none hover:opacity-70 transition-opacity"
      >
        ×
      </button>
    </div>
  </div>
  }
</div>
