<div class="filters-container">
  <mat-form-field appearance="outline">
    <mat-label>Nume complet</mat-label>
    <input
      matInput
      (input)="nameSearchChange.emit($any($event.target).value)"
      placeholder="Cauta nume..."
    />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Email</mat-label>
    <input
      matInput
      (input)="emailSearchChange.emit($any($event.target).value)"
      placeholder="Cauta email..."
    />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Roluri</mat-label>
    <mat-select multiple [value]="selectedRoles" (selectionChange)="roleChange.emit($event.value)">
      @for (role of roles; track role) {
      <mat-option [value]="role">{{ role }}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Locații</mat-label>
    <mat-select
      multiple
      [value]="selectedLocations"
      (selectionChange)="locationChange.emit($event.value)"
    >
      @for (loc of locations; track loc) {
      <mat-option [value]="loc">{{ loc }}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Status</mat-label>
    <mat-select
      multiple
      [value]="selectedStatuses"
      (selectionChange)="statusChange.emit($event.value)"
    >
      <mat-option value="active">Activ</mat-option>
      <mat-option value="inactive">Inactiv</mat-option>
    </mat-select>
  </mat-form-field>
</div>

<table mat-table [dataSource]="users" class="mat-elevation-z8">
  @for (col of columns; track col.key) {
  <ng-container [matColumnDef]="col.key">
    <th mat-header-cell *matHeaderCellDef> {{ col.label }} </th>

    <td mat-cell *matCellDef="let row">
      <generic-cell-view [column]="col" [row]="row" (valueChanged)="cellAction.emit($event)">
      </generic-cell-view>
    </td>
  </ng-container>
  }

  <tr mat-header-row *matHeaderRowDef="displayedColumnKeys"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumnKeys;"></tr>
</table>
