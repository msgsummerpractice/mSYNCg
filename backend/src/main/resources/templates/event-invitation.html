<!doctype html>
<html>
  <body style="font-family: Arial, sans-serif; color: #222">
    %s
    <h1 style="margin: 0 0 12px 0">%s</h1>
    <p style="margin: 4px 0"><strong>Registration starts:</strong> %s</p>
    <p style="margin: 4px 0"><strong>Registration ends:</strong> %s</p>
    <p style="margin: 4px 0"><strong>Location:</strong> %s</p>
    <p style="margin: 16px 0">
      <a
        href="%s"
        style="
          display: inline-block;
          padding: 10px 16px;
          background: #1976d2;
          color: #fff;
          text-decoration: none;
          border-radius: 4px;
        "
      >
        View event
      </a>
    </p>
  </body>
</html>
